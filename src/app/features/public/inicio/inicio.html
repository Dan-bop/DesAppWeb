</section>

<div class="container py-5">
  <h2 class="section-title">Selecciona tu Ciudad</h2>

<div class="cities-grid">
  <div class="city-box" *ngFor="let ciudad of ciudades" [routerLink]="['/sedes', ciudad.id]">
    <img [src]="ciudad.imagen" [alt]="ciudad.nombre">
    <div class="city-name">
      {{ ciudad.nombre | uppercase }}
    </div>
  </div>
</div>
