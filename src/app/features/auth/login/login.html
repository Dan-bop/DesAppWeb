<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4 shadow-lg border-0">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        <form (ngSubmit)="onLogin()">
          <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" [(ngModel)]="credenciales.email" required>
          </div>
          <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" [(ngModel)]="credenciales.password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="mt-3 text-center">
          ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
